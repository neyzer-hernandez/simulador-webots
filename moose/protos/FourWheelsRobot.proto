#VRML_SIM R2025a utf8
PROTO FourWheelsRobot [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFFloat    bodyMass     1
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    children [
      DistanceSensor {
        translation 0.105 -0.03 0.01
        rotation -1 0 0 0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.333333 0 1
            }
            geometry Box {
              size 0.01 0.01 0.01
            }
          }
        ]
        name "ds_right"
      }
      DistanceSensor {
        translation 0.105 0.03 0.01
        rotation 1 0 0 0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.333333 0 1
            }
            geometry Box {
              size 0.01 0.01 0.01
            }
          }
        ]
        name "ds_left"
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.05 0.06 0
        }
        device [
          RotationalMotor {
            name "wheel1"
          }
        ]
        endPoint DEF WHEEL1 Solid {
          translation 0.05 0.06 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.333333 0.666667 0.498039
              }
              geometry Cylinder {
                height 0.02
                radius 0.04
              }
            }
          ]
          boundingObject Cylinder {
            height 0.02
            radius 0.04
          }
          physics Physics {
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.05 0.06 0
        }
        device [
          RotationalMotor {
            name "wheel2"
          }
        ]
        endPoint Solid {
          translation -0.05 0.06 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0 0.666667 0
              }
              geometry Cylinder {
                height 0.02
                radius 0.04
              }
            }
          ]
          name "WHEEL2"
          boundingObject Cylinder {
            height 0.1
            radius 0.05
          }
          physics Physics {
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.05 -0.06 0
        }
        device [
          RotationalMotor {
            name "wheel3"
          }
        ]
        endPoint Solid {
          translation 0.05 -0.06 0
          rotation 1 0 0 1.5078
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.333333 0.666667 0
              }
              geometry Cylinder {
                height 0.02
                radius 0.04
              }
            }
          ]
          name "WHEEL3"
          boundingObject Cylinder {
            height 0.1
            radius 0.05
          }
          physics Physics {
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.05 -0.06 0
        }
        device [
          DEF wheel4 RotationalMotor {
            name "wheel4"
          }
        ]
        endPoint Solid {
          translation -0.05 -0.06 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.333333 0.666667 0
              }
              geometry Cylinder {
                height 0.02
                radius 0.04
              }
            }
          ]
          name "WHEEL4"
          boundingObject Cylinder {
            height 0.1
            radius 0.05
          }
          physics Physics {
          }
        }
      }
      Solid {
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 0 0
            }
            geometry Box {
              size 0.2 0.1 0.05
            }
          }
        ]
        name "BODY"
      }
    ]
    boundingObject USE BODY
    physics Physics {
      density -1
      mass IS bodyMass
    }
    name "four_wheeled_robot"
    controller "four_wheeled_collision_avoidance"
    controllerArgs [
      ""
    ]
  }
}
